<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FireFlow AI MVP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

    :root {
      --primary-text: #000000;
      --secondary-text: #666666;
      --muted-text: #999999;
      --border-color: #e5e5e5;
      --soft-bg: #f7f7f7;
      --alert-bg: #fff4f0;
      --alert-border: #ff3300;
      --bg-color: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-color);
      color: var(--primary-text);
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1400px, calc(100% - 80px));
      margin: 0 auto;
    }

    .site-header,
    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border-color);
    }

    .site-footer {
      align-items: flex-end;
      border-top: 1px solid var(--border-color);
      border-bottom: 0;
      padding: 48px 40px;
    }

    .logo-text,
    .logo-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--primary-text);
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-text span,
    .logo-button span {
      color: var(--secondary-text);
      font-weight: 700;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 28px;
      color: var(--primary-text);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .top-nav button {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--primary-text);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hero,
    .page-hero {
      padding: 92px 0 64px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 20px;
      color: var(--muted-text);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero h1,
    .page-hero h1 {
      margin: 0;
      font-size: clamp(4.8rem, 12vw, 10rem);
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .page-hero h1 {
      max-width: 980px;
      font-size: clamp(4rem, 9vw, 8rem);
    }

    .hero-copy,
    .page-hero p {
      display: flex;
      justify-content: flex-end;
      margin-top: 52px;
    }

    .hero-copy p,
    .page-hero p {
      width: min(620px, 100%);
      margin-left: auto;
      color: var(--primary-text);
      font-size: clamp(1.35rem, 2.2vw, 1.8rem);
      font-weight: 500;
      line-height: 1.3;
    }

    .role-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }

    .role-card {
      min-height: 320px;
      padding: 40px;
      border: 0;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--primary-text);
      text-align: left;
    }

    .role-card:hover {
      background: var(--primary-text);
      color: var(--bg-color);
    }

    .mode-badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 5px 10px;
      background: var(--soft-bg);
      color: var(--primary-text);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .role-card strong {
      display: block;
      margin-bottom: 18px;
      font-size: 2rem;
      font-weight: 900;
    }

    .role-card p {
      margin: 0 0 40px;
      color: var(--secondary-text);
      font-size: 1rem;
    }

    .role-card:hover p {
      color: #dddddd;
    }

    .stats-band,
    .control-stats {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 60px;
      padding: 90px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-grid,
    .control-stats {
      grid-template-columns: repeat(3, 1fr);
    }

    .stat-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-card strong {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 900;
      line-height: 1;
    }

    .stat-card span,
    .site-footer p,
    .site-footer span {
      color: var(--secondary-text);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .dashboard-grid,
    .control-grid {
      display: grid;
      grid-template-columns: minmax(320px, 0.85fr) 1.15fr;
      margin-bottom: 90px;
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }

    .panel,
    .result-card {
      padding: 32px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-panel label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--primary-text);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .form-panel input,
    .form-panel textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      padding: 14px 16px;
      color: var(--primary-text);
      font-size: 1rem;
      font-weight: 500;
      text-transform: none;
    }

    .toggle-grid {
      display: grid;
      gap: 10px;
    }

    .toggle-grid label {
      flex-direction: row;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: none;
    }

    .condition-section {
      display: grid;
      gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--border-color);
    }

    .condition-section-title {
      margin: 0;
      color: var(--muted-text);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .condition-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .condition-option {
      display: grid !important;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 8px !important;
      min-height: 44px;
      border: 1px solid var(--border-color);
      padding: 10px 12px !important;
      font-size: 0.9rem !important;
      font-weight: 700 !important;
      text-transform: none !important;
    }

    .condition-option input {
      width: auto;
      margin: 0;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .preset-button {
      border: 1px solid var(--border-color);
      background: var(--soft-bg);
      padding: 10px 12px;
      color: var(--primary-text);
      font-size: 0.82rem;
      font-weight: 800;
      text-align: left;
    }

    .preset-button.is-selected {
      border-color: var(--primary-text);
      background: var(--primary-text);
      color: var(--bg-color);
    }

    .primary-button,
    .secondary-button {
      border: 1px solid var(--primary-text);
      padding: 18px 26px;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .primary-button {
      background: var(--primary-text);
      color: var(--bg-color);
    }

    .secondary-button {
      background: var(--bg-color);
      color: var(--primary-text);
    }

    .result-stack {
      display: grid;
    }

    .result-card h3 {
      margin: 0 0 18px;
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .result-card p {
      margin: 0;
      color: var(--secondary-text);
    }

    .result-card-alert {
      border-left: 4px solid var(--alert-border);
      background: var(--alert-bg);
    }

    .guide-text {
      color: var(--primary-text) !important;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .action-list,
    .check-list {
      margin: 0;
      padding-left: 22px;
    }

    .action-list li,
    .check-list li {
      margin-bottom: 10px;
      color: var(--primary-text);
      font-weight: 700;
    }

    .priority-list {
      padding-left: 0;
      list-style-position: inside;
    }

    .first-action {
      margin-bottom: 16px !important;
      border-left: 4px solid var(--alert-border);
      background: var(--alert-bg);
      padding: 14px 16px;
      list-style-position: inside;
    }

    .summary-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-strip strong {
      font-size: 1rem;
    }

    .summary-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-tags span {
      border: 1px solid var(--border-color);
      background: var(--soft-bg);
      padding: 6px 10px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .incident-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .incident-tags span {
      border: 1px solid var(--border-color);
      background: var(--soft-bg);
      padding: 4px 8px;
      color: var(--primary-text);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .summary-note {
      margin-top: 14px !important;
    }

    .info-list {
      margin: 0;
    }

    .info-list div {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .info-list dt {
      color: var(--muted-text);
      font-size: 0.8rem;
      font-weight: 900;
    }

    .info-list dd {
      margin: 0;
      font-weight: 700;
    }

    .incident-list {
      display: grid;
    }

    .incident-item {
      display: grid;
      gap: 10px;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border-color);
      background: transparent;
      padding: 20px 0;
      text-align: left;
    }

    .incident-item.is-active,
    .incident-item:hover {
      background: var(--soft-bg);
    }

    .risk-pill {
      width: fit-content;
      padding: 4px 10px;
      background: var(--soft-bg);
      font-size: 0.75rem;
      font-weight: 900;
    }

    .risk-높음 {
      background: #ff3300;
      color: #ffffff;
    }

    .risk-중간 {
      background: #000000;
      color: #ffffff;
    }

    .risk-낮음 {
      background: #e5e5e5;
    }

    .map-placeholder {
      min-height: 280px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background-size: 50px 50px;
      background-image:
        linear-gradient(to right, #f0f0f0 1px, transparent 1px),
        linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .map-placeholder::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #ffcccc;
    }

    .map-panel {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 20px;
      text-align: center;
    }

    .map-panel span {
      display: block;
      color: var(--secondary-text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
    }

    .map-panel strong {
      display: block;
      margin-top: 4px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .map-panel p {
      max-width: 360px;
      margin: 8px 0 0;
      color: var(--secondary-text);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .map-pin {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 2px solid var(--bg-color);
      border-radius: 50%;
      background: var(--primary-text);
      color: var(--bg-color);
      font-size: 0.78rem;
      font-weight: 900;
      box-shadow: 0 0 0 1px var(--primary-text);
    }

    .map-pin.is-selected {
      width: 42px;
      height: 42px;
      background: var(--alert-border);
      box-shadow: 0 0 0 3px rgba(255, 51, 0, 0.18);
    }

    .map-pin-1 { left: 22%; top: 38%; }
    .map-pin-2 { left: 58%; top: 28%; }
    .map-pin-3 { left: 70%; top: 62%; }
    .map-pin-4 { left: 35%; top: 68%; }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .container {
        width: min(100% - 32px, 1400px);
      }

      .site-header,
      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px 16px;
      }

      .top-nav {
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero,
      .page-hero {
        padding: 60px 0 42px;
      }

      .role-section,
      .stats-band,
      .control-stats,
      .dashboard-grid,
      .control-grid {
        grid-template-columns: 1fr;
      }

      .role-card {
        min-height: 240px;
        padding: 28px;
      }

      .panel,
      .result-card {
        padding: 24px;
      }

      .condition-grid {
        grid-template-columns: 1fr;
      }

      .preset-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    let incidents = [];

    const building = {
      name: '시연용 기본 건물',
      floors: '층수 정보 미연동',
      usage: '용도 정보 미연동',
      structure: '구조 정보 미연동',
      risk_note: '건물 상세 정보는 공공데이터 미연동 상태입니다'
    };

    const demoBriefing = {
      building_info: building,
      summary: '',
      risk_level: '미확인',
      priorities: [
        '인명 고립 가능 구역 우선 수색',
        '5층 진입 전 연기 확산 방향 확인',
        '계단실과 피난 경로 확보 여부 확인',
        '전기/가스 차단 가능성 현장 확인',
        '상층부 연기 확산 차단 및 배연 계획 수립'
      ],
      checklist: [
        '현장 지휘관에게 신고 요약 공유',
        '호흡보호장비 착용 상태 확인',
        '진입조와 대기조 임무 분리',
        '무전 채널과 퇴출 신호 확인'
      ],
      disclaimer: '시연용 더미 브리핑입니다. 화재 규모, 구조 안정성, 인명 상태는 현장 확인이 필요합니다.'
    };

    let selectedIncidentId = 1;
    let citizenResult = null;
    let firefighterResult = null;

    function createGuideFromIncident(incident) {
      return {
        guide: `${incident.address} ${incident.fire_floor} 기준 안내입니다. 문을 닫고 연기가 들어오는 틈을 막은 뒤 119에 현재 위치와 층수를 반복해서 알리세요.`,
        priority_actions: [
          '연기 아래쪽으로 몸을 낮추고 짧게 호흡하기',
          '문틈을 젖은 천이나 옷으로 막기',
          '창가나 잘 보이는 위치에서 구조 신호 보내기',
          '낮은 자세로 호흡하고 이동 최소화하기'
        ],
        warning: '엘리베이터는 사용하지 마세요. 상황이 악화되면 즉시 119와 현장 안내를 우선하세요.',
        disclaimer: '현재 입력된 정보를 기준으로 한 참고 안내입니다. 실제 상황에서는 119와 현장 안내를 우선하세요.'
      };
    }

    function createBriefingFromIncident(incident) {
      return {
        ...demoBriefing,
        summary: `${incident.address} ${incident.fire_floor}에서 시민 입력 신고가 접수되었습니다. 신고 내용: ${incident.summary} 건물 정보는 시연용 기본 건물 데이터를 사용합니다.`,
        risk_level: incident.risk_level
      };
    }

    function createCitizenReportFromSample() {
      const address = document.getElementById('citizen-address').value.trim() || '시연용 신규 건물';
      const floor = document.getElementById('citizen-floor').value.trim() || '미확인 층';
      const note = document.getElementById('citizen-note').value.trim();
      const hasSmoke = document.getElementById('citizen-smoke').checked;
      const hasFlame = document.getElementById('citizen-flame').checked;
      const stairsAvailable = document.getElementById('citizen-stairs').checked;
      const isTrapped = document.getElementById('citizen-trapped').checked;
      const hasVulnerablePeople = document.getElementById('citizen-vulnerable').checked;
      const score = Number(hasSmoke) + Number(hasFlame) * 2 + Number(!stairsAvailable) + Number(isTrapped) * 2 + Number(hasVulnerablePeople);
      const riskLevel = score >= 4 ? '높음' : score >= 2 ? '중간' : '낮음';
      const conditions = [
        hasSmoke ? '연기 발생' : '',
        hasFlame ? '불꽃 목격' : '',
        !stairsAvailable ? '계단 이용 불확실' : '',
        isTrapped ? '신고자 고립 가능' : '',
        hasVulnerablePeople ? '노약자/아이/장애인 동행' : ''
      ].filter(Boolean);
      const incident = {
        id: incidents.length > 0 ? Math.max(...incidents.map((item) => item.id)) + 1 : 1,
        address,
        fire_floor: floor,
        risk_level: riskLevel,
        status: '접수됨',
        summary: `${floor}에서 시민 입력 신고 접수. ${conditions.length ? conditions.join(', ') : '세부 위험 정보 제한적'}.${note ? ` 추가 메모: ${note}` : ''}`
      };
      incidents = [incident, ...incidents];
      selectedIncidentId = incident.id;
      citizenResult = createGuideFromIncident(incident);
      renderCitizen();
    }

    function statCard(value, label) {
      return `<div class="stat-card"><strong>${value}</strong><span>${label}</span></div>`;
    }

    function resultCard(title, content, tone = 'default') {
      return `<section class="result-card result-card-${tone}"><h3>${title}</h3>${content}</section>`;
    }

    function layout(mode, title, subtitle, content) {
      return `
        <div class="app-shell">
          <header class="site-header">
            <button class="logo-button" type="button" onclick="renderRoleSelect()">FIREFLOW.AI <span>MVP</span></button>
            <nav class="top-nav" aria-label="FireFlow role navigation">
              <button type="button" onclick="renderRoleSelect()">ROLE SELECT</button>
              <span>${mode}</span>
            </nav>
          </header>
          <main>
            <section class="page-hero container">
              <span class="eyebrow">${mode}</span>
              <h1>${title}</h1>
              <p>${subtitle}</p>
            </section>
            ${content}
          </main>
          <footer class="site-footer">
            <div>
              <strong>FIREFLOW</strong>
              <p>공모전용 MVP. 더미 데이터 기반 시연.</p>
            </div>
            <span>V0.1.0 / STANDALONE SAMPLE</span>
          </footer>
        </div>
      `;
    }

    function renderRoleSelect() {
      document.getElementById('app').innerHTML = `
        <div class="app-shell">
          <header class="site-header">
            <div class="logo-text">FIREFLOW.AI <span>MVP</span></div>
            <nav class="top-nav" aria-label="System status">
              <span>CITIZEN</span>
              <span>FIRE RESPONSE</span>
              <span>CONTROL</span>
            </nav>
          </header>
          <main>
            <section class="hero container">
              <span class="eyebrow">COMPETITION / DUMMY INTELLIGENCE</span>
              <h1>FireFlow<br />AI</h1>
              <div class="hero-copy">
                <p>화재 상황에서 시민 대피, 소방 현장 요약, 중앙 통제를 역할별로 분리해 지원하는 공모전용 소방안전 MVP입니다.</p>
              </div>
            </section>
            <section class="role-section container" aria-label="역할 선택">

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function uniqueItems(items) {
      return items.filter((item, index) => items.indexOf(item) === index);
    }

    function parseFloorNumber(floor) {
      const match = String(floor || '').match(/-?\d+/);
      return match ? Number(match[0]) : null;
    }

    function noteHasAny(note, keywords) {
      return keywords.some((keyword) => note.includes(keyword));
    }

    function createGuideFromIncident(incident) {
      const report = incident.report || {};
      const note = String(report.report_note || '').toLowerCase();
      const floorNumber = parseFloorNumber(incident.fire_floor);
      const isBasement = String(incident.fire_floor || '').includes('지하') || (floorNumber !== null && floorNumber < 0);
      const isHighFloor = floorNumber !== null && floorNumber >= 6;
      const mentionsChild = noteHasAny(note, ['아이', '어린', '유아', '아동']);
      const mentionsHallwaySmoke = note.includes('복도') && note.includes('연기');
      const mentionsDoorRisk = noteHasAny(note, ['문', '손잡이', '문고리']) && noteHasAny(note, ['뜨겁', '열', '닫', '안 열']);
      const mentionsWindow = noteHasAny(note, ['창문', '베란다', '발코니']);

      const actions = ['119에 현재 주소, 층수, 동행자 여부를 먼저 알리세요.'];
      const avoidActions = ['엘리베이터 사용', '대피 후 건물 재진입', '확인되지 않은 통로로 단독 이동'];
      const guideParts = [];

      const childCompanion = report.has_child_companion || mentionsChild;
      const hallwaySmoke = report.hallway_smoke_visible || mentionsHallwaySmoke || report.has_smoke;
      const doorRisk = report.door_closed || report.door_handle_hot || mentionsDoorRisk;

      if (report.is_trapped) {
        guideParts.push('현재 위치에서 무리하게 이동하지 말고 구조 요청을 유지하는 상황으로 판단됩니다.');
        actions.push('문틈을 젖은 수건이나 천으로 막아 연기 유입을 줄이세요.');
        actions.push('창문이나 외부에서 보이는 위치에서 구조 신호를 보내되, 뛰어내리거나 난간으로 이동하지 마세요.');
        actions.push('가능하면 바닥 가까이 낮은 자세를 유지하고 통화 배터리를 아끼세요.');
      } else if (!report.stairs_available || report.has_flame) {
        guideParts.push('계단이나 복도 이용이 불확실하므로 이동 전 통로 상태를 다시 확인해야 합니다.');
        actions.push('불꽃이 보이는 방향과 연기가 짙은 방향으로 이동하지 마세요.');
        actions.push('가까운 방이나 구획된 공간으로 들어가 문을 닫고 119에 위치를 반복해서 알리세요.');
      } else {
        guideParts.push('통로가 확인되는 경우에만 낮은 자세로 가까운 계단 방향 대피를 시도하세요.');
        actions.push('수건이나 옷으로 코와 입을 가리고 벽을 따라 천천히 이동하세요.');
        actions.push('계단 진입 전 연기와 열기가 강해지는지 확인하고 이상하면 즉시 되돌아가세요.');
      }

      if (hallwaySmoke) {
        guideParts.push('복도 쪽 연기 가능성이 있으므로 복도 이동은 특히 주의가 필요합니다.');
        actions.splice(1, 0, '복도를 지나야 한다면 머리와 몸을 최대한 숙이고, 젖은 천으로 코와 입을 가리세요.');
        avoidActions.push('연기가 보이는 복도에서 서서 빠르게 뛰기');
      }

      if (doorRisk) {
        guideParts.push('문 주변 열기나 닫힌 문 정보가 있어 문을 열기 전 확인이 필요합니다.');
        actions.splice(1, 0, '문 손잡이를 함부로 잡지 말고 손등으로 문 주변 열기를 확인하세요.');
        actions.splice(2, 0, '열리지 않는 문은 억지로 열지 말고 다른 위치에서 구조 요청을 이어가세요.');
        avoidActions.push('뜨겁거나 열리지 않는 문 강제로 열기');
      }

      if (childCompanion) {
        guideParts.push('어린아이는 놀라서 구석이나 가구 뒤로 숨을 수 있어 계속 시야 안에 두어야 합니다.');
        actions.splice(1, 0, '어린아이가 있다면 손을 잡거나 품 가까이에 두고, 구석으로 숨지 않는지 계속 확인하세요.');
      }

      if (report.has_vulnerable_people) {
        actions.push('노약자, 장애인 등 이동이 느린 동행자는 한 사람씩 역할을 나눠 부축하고 속도를 맞추세요.');
      }

      if (isBasement) {
        guideParts.push('지하층은 연기가 아래로 유입될 수 있어 출입구 방향 확인과 구조 요청이 중요합니다.');
        actions.push('지하층이면 출입구 방향의 연기와 열기를 확인하고, 막혀 있으면 즉시 현재 위치를 119에 알리세요.');
      }

      if (isHighFloor) {
        actions.push('고층에서는 창문 밖으로 이동하거나 뛰어내리지 말고 계단 상태와 구조 안내를 우선 확인하세요.');
      }

      if (mentionsWindow) {
        actions.push('창문을 열 때는 연기가 더 들어오는지 확인하고, 구조 신호가 필요한 경우에만 짧게 활용하세요.');
      }

      if (report.report_note.trim()) {
        guideParts.push('추가 메모에 적힌 상황을 반영한 참고 안내입니다.');
      }

      return {
        guide: `${escapeHtml(incident.address)} ${escapeHtml(incident.fire_floor)} 기준 안내입니다. ${guideParts.join(' ')}`,
        priority_actions: uniqueItems(actions),
        avoid_actions: uniqueItems(avoidActions),
        warning: '상황이 나빠지거나 이동 경로가 불확실하면 즉시 이동을 멈추고 119 및 현장 안내를 우선하세요.',
        disclaimer: '현재 입력된 정보를 기준으로 한 참고 안내입니다. 실제 상황에서는 119와 현장 안내를 우선하세요.'
      };
    }

    function createCitizenReportFromSample() {
      const address = document.getElementById('citizen-address').value.trim() || '시연용 A건물';
      const floor = document.getElementById('citizen-floor').value.trim() || '미확인 층';
      const note = document.getElementById('citizen-note').value.trim();
      const report = {
        has_smoke: document.getElementById('citizen-smoke').checked,
        has_flame: document.getElementById('citizen-flame').checked,
        stairs_available: document.getElementById('citizen-stairs').checked,
        is_trapped: document.getElementById('citizen-trapped').checked,
        has_vulnerable_people: document.getElementById('citizen-vulnerable').checked,
        has_child_companion: document.getElementById('citizen-child').checked,
        hallway_smoke_visible: document.getElementById('citizen-hallway-smoke').checked,
        door_closed: document.getElementById('citizen-door-closed').checked,
        door_handle_hot: document.getElementById('citizen-door-hot').checked,
        report_note: note
      };
      const score =
        Number(report.has_smoke) +
        Number(report.hallway_smoke_visible) +
        Number(report.has_flame) * 2 +
        Number(!report.stairs_available) +
        Number(report.is_trapped) * 2 +
        Number(report.has_vulnerable_people) +
        Number(report.has_child_companion) +
        Number(report.door_handle_hot);
      const riskLevel = score >= 4 ? '높음' : score >= 2 ? '중간' : '낮음';
      const conditions = [
        report.has_smoke ? '연기 발생' : '',
        report.hallway_smoke_visible ? '복도 쪽 연기 확인' : '',
        report.has_flame ? '불꽃 목격' : '',
        !report.stairs_available ? '계단 이용 불확실' : '',
        report.is_trapped ? '신고자 고립 가능' : '',
        report.has_vulnerable_people ? '노약자/장애인 동행' : '',
        report.has_child_companion ? '어린아이 동행' : '',
        report.door_closed ? '문 닫힘' : '',
        report.door_handle_hot ? '문 손잡이 열감' : ''
      ].filter(Boolean);
      const incident = {
        id: incidents.length > 0 ? Math.max(...incidents.map((item) => item.id)) + 1 : 1,
        address,
        fire_floor: floor,
        risk_level: riskLevel,
        status: '접수됨',
        summary: `${floor}에서 시민 입력 신고 접수. ${conditions.length ? conditions.join(', ') : '세부 위험 정보 제한적'}.${note ? ` 추가 메모: ${note}` : ''}`,
        report
      };
      incidents = [incident, ...incidents];
      selectedIncidentId = incident.id;
      citizenResult = createGuideFromIncident(incident);
      renderCitizen();
    }

    function renderCitizen() {
      const result = citizenResult ? `
        ${resultCard('참고용 대피 안내', `<p class="guide-text">${citizenResult.guide}</p>`, 'alert')}
        ${resultCard('우선 행동 목록', `<ol class="action-list">${citizenResult.priority_actions.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ol>`)}
        ${resultCard('피해야 할 행동', `<ol class="action-list">${citizenResult.avoid_actions.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ol>`)}
        ${resultCard('경고', `<p>${escapeHtml(citizenResult.warning)}</p>`)}
        ${resultCard('안내 범위', `<p>${escapeHtml(citizenResult.disclaimer)}</p>`)}
      ` : resultCard('대피 안내 대기', '<p>왼쪽 정보를 입력하고 시연용 신고를 등록하면 대피 안내가 표시되고, 같은 신고가 소방관과 중앙 통제 화면에도 표시됩니다.</p>');

      document.getElementById('app').innerHTML = layout(
        'CITIZEN EVACUATION',
        '시민 대피 안내',
        '현재 입력한 주소, 층수, 상황 체크, 메모를 기준으로 즉시 참고할 행동을 정리합니다.',
        `
          <section class="dashboard-grid container">
            <form class="panel form-panel" onsubmit="event.preventDefault(); createCitizenReportFromSample();">
              <label>현재 위치 또는 주소<input id="citizen-address" placeholder="예: 시연용 A건물" autocomplete="off" required /></label>
              <label>현재 층<input id="citizen-floor" placeholder="예: 5층, 지하 1층" autocomplete="off" required /></label>
              <label>추가 상황 메모<textarea id="citizen-note" rows="4" placeholder="예: 복도 쪽에 연기가 보이고 아이가 함께 있습니다."></textarea></label>
              <div class="toggle-grid">
                <div class="condition-section">
                  <p class="condition-section-title">위험 징후</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-smoke" type="checkbox" /> 연기가 있음</label>
                    <label class="condition-option"><input id="citizen-hallway-smoke" type="checkbox" /> 복도 쪽 연기가 보임</label>
                    <label class="condition-option"><input id="citizen-flame" type="checkbox" /> 불꽃이 보임</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">이동 상태</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-stairs" type="checkbox" /> 계단 이용 가능</label>
                    <label class="condition-option"><input id="citizen-trapped" type="checkbox" /> 갇혀 있거나 이동이 어려움</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">동행자</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-vulnerable" type="checkbox" /> 노약자/장애인 동행</label>
                    <label class="condition-option"><input id="citizen-child" type="checkbox" /> 어린아이 동행</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">문 상태</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-door-closed" type="checkbox" /> 문이 닫혀 있음</label>
                    <label class="condition-option"><input id="citizen-door-hot" type="checkbox" /> 문 손잡이나 문 주변이 뜨거움</label>
                  </div>
                </div>
              </div>
              <button class="primary-button" type="submit">시연용 신고 등록</button>
            </form>
            <div class="result-stack">${result}</div>
          </section>
        `
      );
    }

    const sampleConditionLabels = {
      has_smoke: '연기가 있음',
      hallway_smoke_visible: '복도 쪽 연기가 보임',
      has_flame: '불꽃이 보임',
      stairs_available: '계단 이용 가능',
      is_trapped: '갇혀 있거나 이동이 어려움',
      has_vulnerable_people: '노약자/장애인 동행',
      has_child_companion: '어린아이 동행',
      door_closed: '문이 닫혀 있음',
      door_handle_hot: '문 손잡이나 문 주변이 뜨거움'
    };

    const selectedSampleScenarioIndexes = new Set();

    const sampleScenarioPresets = [
      {
        label: '복도 연기 + 아이',
        values: {
          note: '복도 쪽에 연기가 보이고 어린아이와 함께 있습니다.',
          has_smoke: true,
          hallway_smoke_visible: true,
          has_child_companion: true,
          stairs_available: true
        }
      },
      {
        label: '문 손잡이 뜨거움',
        values: {
          note: '문 손잡이가 뜨겁고 문이 잘 열리지 않습니다.',
          door_closed: true,
          door_handle_hot: true,
          stairs_available: false
        }
      },
      {
        label: '고립 상황',
        values: {
          note: '연기가 들어오고 이동이 어려운 상태입니다.',
          has_smoke: true,
          is_trapped: true,
          has_vulnerable_people: true
        }
      },
      {
        label: '지하층 대피',
        values: {
          note: '지하층 출입구 방향에 연기가 보입니다.',
          hallway_smoke_visible: true,
          stairs_available: true
        }
      }
    ];

    function selectedSampleConditions(report) {
      return Object.entries(sampleConditionLabels)
        .filter(([field]) => report[field])
        .map(([, label]) => label);
    }

    function incidentTagsHtml(report) {
      const labels = selectedSampleConditions(report || {});
      return `<div class="incident-tags">${
        labels.length > 0
          ? labels.map((label) => `<span>${escapeHtml(label)}</span>`).join('')
          : '<span>상세 조건 없음</span>'
      }</div>`;
    }

    function samplePresetButtons() {
      return `<div class="preset-row" aria-label="시연 예시">
        ${sampleScenarioPresets.map((preset, index) => `<button class="preset-button ${selectedSampleScenarioIndexes.has(index) ? 'is-selected' : ''}" type="button" onclick="applySampleScenario(${index})">${preset.label}</button>`).join('')}
      </div>`;
    }

    function applySampleScenario(index) {
      const values = sampleScenarioPresets[index].values;
      selectedSampleScenarioIndexes.add(index);
      const currentAddress = document.getElementById('citizen-address')?.value || '';
      const currentFloor = document.getElementById('citizen-floor')?.value || '';
      const currentNote = document.getElementById('citizen-note')?.value || '';
      const fieldIds = {
        has_smoke: 'citizen-smoke',
        hallway_smoke_visible: 'citizen-hallway-smoke',
        has_flame: 'citizen-flame',
        stairs_available: 'citizen-stairs',
        is_trapped: 'citizen-trapped',
        has_vulnerable_people: 'citizen-vulnerable',
        has_child_companion: 'citizen-child',
        door_closed: 'citizen-door-closed',
        door_handle_hot: 'citizen-door-hot'
      };
      const currentChecked = Object.fromEntries(
        Object.entries(fieldIds).map(([field, id]) => [field, Boolean(document.getElementById(id)?.checked)])
      );
      renderCitizen();
      document.getElementById('citizen-address').value = currentAddress;
      document.getElementById('citizen-floor').value = currentFloor;
      document.getElementById('citizen-note').value = currentNote && values.note
        ? `${currentNote}\n${values.note}`
        : currentNote || values.note || '';
      Object.keys(sampleConditionLabels).forEach((field) => {
        const id = fieldIds[field];
        document.getElementById(id).checked = currentChecked[field] || values[field] === true;
      });
    }

    function renderCitizen() {
      const selected = selectedIncidentId ? incidents.find((incident) => incident.id === selectedIncidentId) : null;
      const report = selected?.report || {};
      const selectedConditions = selected ? selectedSampleConditions(report) : [];
      const summaryCard = selected ? resultCard('입력 요약', `
        <div class="summary-strip">
          <span class="risk-pill risk-${selected.risk_level}">참고 위험도 ${escapeHtml(selected.risk_level)}</span>
          <strong>${escapeHtml(selected.address)} / ${escapeHtml(selected.fire_floor)}</strong>
        </div>
        <div class="summary-tags">
          ${selectedConditions.length > 0 ? selectedConditions.map((item) => `<span>${escapeHtml(item)}</span>`).join('') : '<span>선택된 상세 조건 없음</span>'}
        </div>
        ${report.report_note ? `<p class="summary-note">${escapeHtml(report.report_note)}</p>` : ''}
      `) : '';

      const result = citizenResult ? `
        ${summaryCard}
        ${resultCard('참고용 대피 안내', `<p class="guide-text">${citizenResult.guide}</p>`, 'alert')}
        ${resultCard('우선 행동 목록', `<ol class="action-list priority-list">${citizenResult.priority_actions.map((item, index) => `<li class="${index === 0 ? 'first-action' : ''}">${escapeHtml(item)}</li>`).join('')}</ol>`)}
        ${resultCard('피해야 할 행동', `<ol class="action-list">${citizenResult.avoid_actions.map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ol>`)}
        ${resultCard('경고', `<p>${escapeHtml(citizenResult.warning)}</p>`)}
        ${resultCard('안내 범위', `<p>${escapeHtml(citizenResult.disclaimer)}</p>`)}
      ` : resultCard('대피 안내 대기', '<p>왼쪽 정보를 입력하고 시연용 신고를 등록하면 대피 안내가 표시되고, 같은 신고가 소방관과 중앙 통제 화면에도 표시됩니다.</p>');

      document.getElementById('app').innerHTML = layout(
        'CITIZEN EVACUATION',
        '시민 대피 안내',
        '현재 입력한 주소, 층수, 상황 체크, 메모를 기준으로 즉시 참고할 행동을 정리합니다.',
        `
          <section class="dashboard-grid container">
            <form class="panel form-panel" onsubmit="event.preventDefault(); createCitizenReportFromSample();">
              ${samplePresetButtons()}
              <label>현재 위치 또는 주소<input id="citizen-address" placeholder="예: 시연용 A건물" autocomplete="off" required /></label>
              <label>현재 층<input id="citizen-floor" placeholder="예: 5층, 지하 1층" autocomplete="off" required /></label>
              <label>추가 상황 메모<textarea id="citizen-note" rows="4" placeholder="예: 복도 쪽에 연기가 보이고 아이가 함께 있습니다."></textarea></label>
              <div class="toggle-grid">
                <div class="condition-section">
                  <p class="condition-section-title">위험 징후</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-smoke" type="checkbox" /> 연기가 있음</label>
                    <label class="condition-option"><input id="citizen-hallway-smoke" type="checkbox" /> 복도 쪽 연기가 보임</label>
                    <label class="condition-option"><input id="citizen-flame" type="checkbox" /> 불꽃이 보임</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">이동 상태</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-stairs" type="checkbox" /> 계단 이용 가능</label>
                    <label class="condition-option"><input id="citizen-trapped" type="checkbox" /> 갇혀 있거나 이동이 어려움</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">동행자</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-vulnerable" type="checkbox" /> 노약자/장애인 동행</label>
                    <label class="condition-option"><input id="citizen-child" type="checkbox" /> 어린아이 동행</label>
                  </div>
                </div>
                <div class="condition-section">
                  <p class="condition-section-title">문 상태</p>
                  <div class="condition-grid">
                    <label class="condition-option"><input id="citizen-door-closed" type="checkbox" /> 문이 닫혀 있음</label>
                    <label class="condition-option"><input id="citizen-door-hot" type="checkbox" /> 문 손잡이나 문 주변이 뜨거움</label>
                  </div>
                </div>
              </div>
              <button class="primary-button" type="submit">시연용 신고 등록</button>
            </form>
            <div class="result-stack">${result}</div>
          </section>
        `
      );
    }

    renderRoleSelect();
  </script>
</body>
</html>
