<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FireFlow AI MVP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');

    :root {
      --primary-text: #000000;
      --secondary-text: #666666;
      --muted-text: #999999;
      --border-color: #e5e5e5;
      --soft-bg: #f7f7f7;
      --alert-bg: #fff4f0;
      --alert-border: #ff3300;
      --bg-color: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-color);
      color: var(--primary-text);
      line-height: 1.5;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1400px, calc(100% - 80px));
      margin: 0 auto;
    }

    .site-header,
    .site-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border-color);
    }

    .site-footer {
      align-items: flex-end;
      border-top: 1px solid var(--border-color);
      border-bottom: 0;
      padding: 48px 40px;
    }

    .logo-text,
    .logo-button {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--primary-text);
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-text span,
    .logo-button span {
      color: var(--secondary-text);
      font-weight: 700;
    }

    .top-nav {
      display: flex;
      align-items: center;
      gap: 28px;
      color: var(--primary-text);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .top-nav button {
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--primary-text);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .hero,
    .page-hero {
      padding: 92px 0 64px;
    }

    .eyebrow {
      display: block;
      margin-bottom: 20px;
      color: var(--muted-text);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hero h1,
    .page-hero h1 {
      margin: 0;
      font-size: clamp(4.8rem, 12vw, 10rem);
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .page-hero h1 {
      max-width: 980px;
      font-size: clamp(4rem, 9vw, 8rem);
    }

    .hero-copy,
    .page-hero p {
      display: flex;
      justify-content: flex-end;
      margin-top: 52px;
    }

    .hero-copy p,
    .page-hero p {
      width: min(620px, 100%);
      margin-left: auto;
      color: var(--primary-text);
      font-size: clamp(1.35rem, 2.2vw, 1.8rem);
      font-weight: 500;
      line-height: 1.3;
    }

    .role-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }

    .role-card {
      min-height: 320px;
      padding: 40px;
      border: 0;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--primary-text);
      text-align: left;
    }

    .role-card:hover {
      background: var(--primary-text);
      color: var(--bg-color);
    }

    .mode-badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 5px 10px;
      background: var(--soft-bg);
      color: var(--primary-text);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .role-card strong {
      display: block;
      margin-bottom: 18px;
      font-size: 2rem;
      font-weight: 900;
    }

    .role-card p {
      margin: 0 0 40px;
      color: var(--secondary-text);
      font-size: 1rem;
    }

    .role-card:hover p {
      color: #dddddd;
    }

    .stats-band,
    .control-stats {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 60px;
      padding: 90px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-grid,
    .control-stats {
      grid-template-columns: repeat(3, 1fr);
    }

    .stat-card {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .stat-card strong {
      font-size: clamp(3rem, 7vw, 5rem);
      font-weight: 900;
      line-height: 1;
    }

    .stat-card span,
    .site-footer p,
    .site-footer span {
      color: var(--secondary-text);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .dashboard-grid,
    .control-grid {
      display: grid;
      grid-template-columns: minmax(320px, 0.85fr) 1.15fr;
      margin-bottom: 90px;
      border-top: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }

    .panel,
    .result-card {
      padding: 32px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .form-panel label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: var(--primary-text);
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .form-panel input,
    .form-panel textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      padding: 14px 16px;
      color: var(--primary-text);
      font-size: 1rem;
      font-weight: 500;
      text-transform: none;
    }

    .toggle-grid {
      display: grid;
      gap: 10px;
    }

    .toggle-grid label {
      flex-direction: row;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: none;
    }

    .primary-button,
    .secondary-button {
      border: 1px solid var(--primary-text);
      padding: 18px 26px;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .primary-button {
      background: var(--primary-text);
      color: var(--bg-color);
    }

    .secondary-button {
      background: var(--bg-color);
      color: var(--primary-text);
    }

    .result-stack {
      display: grid;
    }

    .result-card h3 {
      margin: 0 0 18px;
      font-size: 1.1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .result-card p {
      margin: 0;
      color: var(--secondary-text);
    }

    .result-card-alert {
      border-left: 4px solid var(--alert-border);
      background: var(--alert-bg);
    }

    .guide-text {
      color: var(--primary-text) !important;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .action-list,
    .check-list {
      margin: 0;
      padding-left: 22px;
    }

    .action-list li,
    .check-list li {
      margin-bottom: 10px;
      color: var(--primary-text);
      font-weight: 700;
    }

    .info-list {
      margin: 0;
    }

    .info-list div {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .info-list dt {
      color: var(--muted-text);
      font-size: 0.8rem;
      font-weight: 900;
    }

    .info-list dd {
      margin: 0;
      font-weight: 700;
    }

    .incident-list {
      display: grid;
    }

    .incident-item {
      display: grid;
      gap: 10px;
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--border-color);
      background: transparent;
      padding: 20px 0;
      text-align: left;
    }

    .incident-item.is-active,
    .incident-item:hover {
      background: var(--soft-bg);
    }

    .risk-pill {
      width: fit-content;
      padding: 4px 10px;
      background: var(--soft-bg);
      font-size: 0.75rem;
      font-weight: 900;
    }

    .risk-높음 {
      background: #ff3300;
      color: #ffffff;
    }

    .risk-중간 {
      background: #000000;
      color: #ffffff;
    }

    .risk-낮음 {
      background: #e5e5e5;
    }

    .map-placeholder {
      min-height: 280px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background-size: 50px 50px;
      background-image:
        linear-gradient(to right, #f0f0f0 1px, transparent 1px),
        linear-gradient(to bottom, #f0f0f0 1px, transparent 1px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .map-placeholder::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: #ffcccc;
    }

    .map-panel {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 20px;
      text-align: center;
    }

    .map-panel span {
      display: block;
      color: var(--secondary-text);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.78rem;
    }

    .map-panel strong {
      display: block;
      margin-top: 4px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .map-panel p {
      max-width: 360px;
      margin: 8px 0 0;
      color: var(--secondary-text);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .map-pin {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border: 2px solid var(--bg-color);
      border-radius: 50%;
      background: var(--primary-text);
      color: var(--bg-color);
      font-size: 0.78rem;
      font-weight: 900;
      box-shadow: 0 0 0 1px var(--primary-text);
    }

    .map-pin.is-selected {
      width: 42px;
      height: 42px;
      background: var(--alert-border);
      box-shadow: 0 0 0 3px rgba(255, 51, 0, 0.18);
    }

    .map-pin-1 { left: 22%; top: 38%; }
    .map-pin-2 { left: 58%; top: 28%; }
    .map-pin-3 { left: 70%; top: 62%; }
    .map-pin-4 { left: 35%; top: 68%; }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .container {
        width: min(100% - 32px, 1400px);
      }

      .site-header,
      .site-footer {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px 16px;
      }

      .top-nav {
        flex-wrap: wrap;
        gap: 12px;
      }

      .hero,
      .page-hero {
        padding: 60px 0 42px;
      }

      .role-section,
      .stats-band,
      .control-stats,
      .dashboard-grid,
      .control-grid {
        grid-template-columns: 1fr;
      }

      .role-card {
        min-height: 240px;
        padding: 28px;
      }

      .panel,
      .result-card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const incidents = [
      {
        id: 1,
        address: '부산광역시 해운대구 A빌딩',
        fire_floor: '5층',
        risk_level: '높음',
        status: '출동 중',
        summary: '5층 사무실 구역에서 연기 확산 신고. 인명 고립 가능성 있음.'
      },
      {
        id: 3,
        address: '부산광역시 수영구 C오피스텔',
        fire_floor: '12층',
        risk_level: '높음',
        status: '현장 도착',
        summary: '고층 주거 구역에서 검은 연기 목격. 상층부 대피 지연 가능성 있음.'
      },
      {
        id: 2,
        address: '부산광역시 부산진구 B상가',
        fire_floor: '2층',
        risk_level: '중간',
        status: '접수됨',
        summary: '상가 내부 화재 신고. 계단 이용 가능 여부 확인 필요.'
      },
      {
        id: 4,
        address: '부산광역시 동래구 D센터',
        fire_floor: '1층',
        risk_level: '낮음',
        status: '진압 중',
        summary: '1층 외부 적재물 화재. 내부 확산 가능성은 낮으나 주변 통제 필요.'
      }
    ];

    const building = {
      name: '해운대 A빌딩',
      floors: '지상 8층 / 지하 1층',
      usage: '근린생활시설',
      structure: '철근콘크리트 구조',
      risk_note: '상층부 연기 확산 시 대피 지연 가능성 있음'
    };

    const demoGuide = {
      guide: '부산광역시 해운대구 A빌딩 5층 기준 안내입니다. 문을 닫고 연기가 들어오는 틈을 막은 뒤 119에 현재 위치와 층수를 반복해서 알리세요.',
      priority_actions: [
        '연기 아래쪽으로 몸을 낮추고 짧게 호흡하기',
        '문틈을 젖은 천이나 옷으로 막기',
        '창가나 잘 보이는 위치에서 구조 신호 보내기',
        '낮은 자세로 호흡하고 이동 최소화하기'
      ],
      warning: '엘리베이터는 사용하지 마세요. 상황이 악화되면 즉시 119와 현장 안내를 우선하세요.',
      disclaimer: '현재 입력된 정보를 기준으로 한 참고 안내입니다. 실제 상황에서는 119와 현장 안내를 우선하세요.'
    };

    const demoBriefing = {
      building_info: building,
      summary: '부산광역시 해운대구 A빌딩 5층에서 화재 신고가 접수되었습니다. 신고 내용: 5층 사무실 구역에서 연기 확산 신고. 인명 고립 가능성 있음. 건물은 철근콘크리트 구조이며 상층부 연기 확산 시 대피 지연 가능성 있음. 현재 더미 판단 위험도는 높음입니다.',
      risk_level: '높음',
      priorities: [
        '인명 고립 가능 구역 우선 수색',
        '5층 진입 전 연기 확산 방향 확인',
        '계단실과 피난 경로 확보 여부 확인',
        '전기/가스 차단 가능성 현장 확인',
        '상층부 연기 확산 차단 및 배연 계획 수립'
      ],
      checklist: [
        '현장 지휘관에게 신고 요약 공유',
        '호흡보호장비 착용 상태 확인',
        '진입조와 대기조 임무 분리',
        '무전 채널과 퇴출 신호 확인'
      ],
      disclaimer: '시연용 더미 브리핑입니다. 화재 규모, 구조 안정성, 인명 상태는 현장 확인이 필요합니다.'
    };

    let selectedIncidentId = 1;
    let citizenResult = null;
    let firefighterResult = null;

    function statCard(value, label) {
      return `<div class="stat-card"><strong>${value}</strong><span>${label}</span></div>`;
    }

    function resultCard(title, content, tone = 'default') {
      return `<section class="result-card result-card-${tone}"><h3>${title}</h3>${content}</section>`;
    }

    function layout(mode, title, subtitle, content) {
      return `
        <div class="app-shell">
          <header class="site-header">
            <button class="logo-button" type="button" onclick="renderRoleSelect()">FIREFLOW.AI <span>MVP</span></button>
            <nav class="top-nav" aria-label="FireFlow role navigation">
              <button type="button" onclick="renderRoleSelect()">ROLE SELECT</button>
              <span>${mode}</span>
            </nav>
          </header>
          <main>
            <section class="page-hero container">
              <span class="eyebrow">${mode}</span>
              <h1>${title}</h1>
              <p>${subtitle}</p>
            </section>
            ${content}
          </main>
          <footer class="site-footer">
            <div>
              <strong>FIREFLOW</strong>
              <p>공모전용 MVP. 더미 데이터 기반 시연.</p>
            </div>
            <span>V0.1.0 / STANDALONE SAMPLE</span>
          </footer>
        </div>
      `;
    }

    function renderRoleSelect() {
      document.getElementById('app').innerHTML = `
        <div class="app-shell">
          <header class="site-header">
            <div class="logo-text">FIREFLOW.AI <span>MVP</span></div>
            <nav class="top-nav" aria-label="System status">
              <span>CITIZEN</span>
              <span>FIRE RESPONSE</span>
              <span>CONTROL</span>
            </nav>
          </header>
          <main>
            <section class="hero container">
              <span class="eyebrow">COMPETITION / DUMMY INTELLIGENCE</span>
              <h1>FireFlow<br />AI</h1>
              <div class="hero-copy">
                <p>화재 상황에서 시민 대피, 소방 현장 요약, 중앙 통제를 역할별로 분리해 지원하는 공모전용 소방안전 MVP입니다.</p>
              </div>
            </section>
            <section class="role-section container" aria-label="역할 선택">
              <button class="role-card" type="button" onclick="renderCitizen()">
                <span class="mode-badge">MODE 01</span>
                <strong>일반 사용자</strong>
                <p>현재 위치와 위험 상황을 입력하고 즉시 대피 행동 지침을 확인합니다.</p>
                <span>OPEN DASHBOARD</span>
              </button>
              <button class="role-card" type="button" onclick="renderFirefighter()">
                <span class="mode-badge">MODE 02</span>
                <strong>소방관</strong>
                <p>신고 내용과 건물 정보를 바탕으로 현장 위험도와 대응 우선순위를 확인합니다.</p>
                <span>OPEN DASHBOARD</span>
              </button>
              <button class="role-card" type="button" onclick="renderControl()">
                <span class="mode-badge">MODE 03</span>
                <strong>중앙 통제</strong>
                <p>여러 신고와 시연용 출동 상태를 한 화면에서 정렬하고 모니터링합니다.</p>
                <span>OPEN DASHBOARD</span>
              </button>
            </section>
            <section class="stats-band container">
              <div>
                <span class="eyebrow">MVP / NO LIVE 119 INTEGRATION</span>
                <p>실제 119 기관 시스템과 연동하지 않고, 더미 데이터만으로 역할별 핵심 흐름을 시연합니다.</p>
              </div>
              <div class="stat-grid">
                ${statCard('3', 'Role dashboards')}
                ${statCard('0', 'External API keys')}
                ${statCard('1', 'Demo incident')}
              </div>
            </section>
          </main>
        </div>
      `;
    }

    function renderCitizen() {
      const result = citizenResult ? `
        ${resultCard('참고용 대피 안내', `<p class="guide-text">${demoGuide.guide}</p>`, 'alert')}
        ${resultCard('우선 행동 목록', `<ol class="action-list">${demoGuide.priority_actions.map((item) => `<li>${item}</li>`).join('')}</ol>`)}
        ${resultCard('경고', `<p>${demoGuide.warning}</p>`)}
        ${resultCard('안내 범위', `<p>${demoGuide.disclaimer}</p>`)}
      ` : resultCard('대피 안내 대기', '<p>왼쪽 정보를 입력하거나 대표 신고로 보기 버튼을 누르면 더미 안내가 표시됩니다.</p>');

      document.getElementById('app').innerHTML = layout(
        'CITIZEN EVACUATION',
        'Survive the Immediate.',
        '복잡한 기능 없이 현재 상태만 입력하고 바로 행동 지침을 확인합니다.',
        `
          <section class="dashboard-grid container">
            <form class="panel form-panel" onsubmit="event.preventDefault(); citizenResult = true; renderCitizen();">
              <label>현재 위치 또는 주소<input value="부산광역시 해운대구 A빌딩" /></label>
              <label>현재 층<input value="5층" /></label>
              <div class="toggle-grid">
                <label><input type="checkbox" checked /> 연기가 많음</label>
                <label><input type="checkbox" /> 불꽃이 보임</label>
                <label><input type="checkbox" checked /> 계단 이용 가능</label>
                <label><input type="checkbox" /> 갇혀 있음</label>
                <label><input type="checkbox" /> 노약자/아이/장애인 동행</label>
              </div>
              <button class="primary-button" type="submit">대피 안내 생성</button>
              <button class="secondary-button" type="button" onclick="citizenResult = true; renderCitizen();">대표 신고로 보기</button>
            </form>
            <div class="result-stack">${result}</div>
          </section>
        `
      );
    }

    function renderFirefighter() {
      const result = firefighterResult ? `
        ${resultCard('건물 정보', `<dl class="info-list">
          <div><dt>건물명</dt><dd>${building.name}</dd></div>
          <div><dt>규모</dt><dd>${building.floors}</dd></div>
          <div><dt>용도</dt><dd>${building.usage}</dd></div>
          <div><dt>구조</dt><dd>${building.structure}</dd></div>
          <div><dt>위험 메모</dt><dd>${building.risk_note}</dd></div>
        </dl>`)}
        ${resultCard(`현장 상황 요약 / 위험도 ${demoBriefing.risk_level}`, `<p>${demoBriefing.summary}</p>`, 'alert')}
        ${resultCard('대응 우선순위', `<ol class="action-list">${demoBriefing.priorities.map((item) => `<li>${item}</li>`).join('')}</ol>`)}
        ${resultCard('현장 대응 체크리스트', `<ul class="check-list">${demoBriefing.checklist.map((item) => `<li>${item}</li>`).join('')}</ul>`)}
        ${resultCard('브리핑 범위', `<p>${demoBriefing.disclaimer}</p>`)}
      ` : resultCard('상황 요약 대기', '<p>신고 정보를 입력하거나 대표 신고 브리핑 버튼을 누르면 더미 현장 요약이 표시됩니다.</p>');

      document.getElementById('app').innerHTML = layout(
        'COMMAND RESPONSE',
        'Command the Incident.',
        '신고 내용과 건물 정보를 결합해 현장 대응에 필요한 정보를 빠르게 요약합니다.',
        `
          <section class="dashboard-grid container">
            <form class="panel form-panel" onsubmit="event.preventDefault(); firefighterResult = true; renderFirefighter();">
              <label>건물 주소<input value="부산광역시 해운대구 A빌딩" /></label>
              <label>신고 내용<textarea rows="5">5층 사무실 구역에서 연기가 복도까지 확산되고 있습니다.</textarea></label>
              <label>화재 발생 층<input value="5층" /></label>
              <div class="toggle-grid">
                <label><input type="checkbox" checked /> 연기 확산</label>
                <label><input type="checkbox" checked /> 인명 고립</label>
              </div>
              <button class="primary-button" type="submit">상황 요약 생성</button>
              <button class="secondary-button" type="button" onclick="firefighterResult = true; renderFirefighter();">대표 신고 브리핑</button>
            </form>
            <div class="result-stack">
              ${mapPlaceholder('FIREFIGHTER MAP PLACEHOLDER', [incidents[0]], incidents[0])}
              ${result}
            </div>
          </section>
        `
      );
    }

    function mapPlaceholder(label, mapIncidents, selectedIncident) {
      return `
        <section class="map-placeholder" aria-label="${label}">
          <div class="map-panel">
            <span>REAL-TIME SPATIAL MAPPING ENGINE</span>
            <strong>${label}</strong>
            ${selectedIncident ? `<p>${selectedIncident.address} / ${selectedIncident.fire_floor} / ${selectedIncident.risk_level}</p>` : ''}
          </div>
          ${mapIncidents.map((incident, index) => `
            <button class="map-pin map-pin-${index + 1} ${selectedIncident && selectedIncident.id === incident.id ? 'is-selected' : ''}" type="button">${incident.id}</button>
          `).join('')}
        </section>
      `;
    }

    function renderControl() {
      const selected = incidents.find((incident) => incident.id === selectedIncidentId) || incidents[0];
      const list = incidents.map((incident) => `
        <button class="incident-item ${selected.id === incident.id ? 'is-active' : ''}" type="button" onclick="selectedIncidentId = ${incident.id}; renderControl();">
          <span class="risk-pill risk-${incident.risk_level}">${incident.risk_level}</span>
          <strong>${incident.address}</strong>
          <small>${incident.fire_floor} / ${incident.status}</small>
        </button>
      `).join('');

      document.getElementById('app').innerHTML = layout(
        'CENTRAL CONTROL',
        'Monitor the Grid.',
        '신고를 위험도 기준으로 정렬하고 시연용 출동 상태와 상세 정보를 한 화면에서 확인합니다.',
        `
          <section class="control-stats container">
            ${statCard(incidents.length, '현재 접수 신고')}
            ${statCard(incidents.filter((incident) => incident.risk_level === '높음').length, '높음 위험도')}
            ${statCard(incidents.length, '진행 중 출동')}
          </section>
          <section class="control-grid container">
            <div class="panel">
              <div>
                <span class="eyebrow">INCIDENT QUEUE</span>
                <h2>접수된 신고</h2>
              </div>
              <div class="incident-list">${list}</div>
            </div>
            <div class="result-stack">
              ${mapPlaceholder('CONTROL MAP PLACEHOLDER', incidents, selected)}
              ${resultCard('신고 상세', `<dl class="info-list">
                <div><dt>주소</dt><dd>${selected.address}</dd></div>
                <div><dt>발생 층</dt><dd>${selected.fire_floor}</dd></div>
                <div><dt>위험도</dt><dd>${selected.risk_level}</dd></div>
                <div><dt>상태</dt><dd>${selected.status}</dd></div>
                <div><dt>요약</dt><dd>${selected.summary}</dd></div>
              </dl>`)}
            </div>
          </section>
        `
      );
    }

    renderRoleSelect();
  </script>
</body>
</html>
